project_id = "alternate-timelines"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.pooler]
enabled = false
port = 54329
pool_mode = "transaction"
default_pool_size = 15
max_client_conn = 100

[realtime]
enabled = true

[studio]
enabled = true
port = 54323
api_url = "http://localhost"

[local_smtp]
enabled = true
port = 54324
smtp_port = 54325
pop3_port = 54326

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://localhost:8084"
additional_redirect_urls = ["http://localhost:8084", "https://localhost:8084"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true

[analytics]
enabled = true
port = 54327
vector_port = 54328
backend = "postgres"

[functions]

# BetterAuth issues opaque session tokens. These handlers authenticate through
# _shared/verifyAuth, so the gateway must not parse the bearer token as a JWT.
[functions.admin-credits]
verify_jwt = false

[functions.check-subscription]
verify_jwt = false

[functions.create-checkout]
verify_jwt = false

[functions.credits]
verify_jwt = false

[functions.credits-validate]
verify_jwt = false

[functions.customer-portal]
verify_jwt = false

[functions.generate-video]
verify_jwt = false

[functions.gallery-books]
verify_jwt = false

[functions.groq-api]
verify_jwt = false

[functions.groq-storyline]
verify_jwt = false

[functions.provision-profile]
verify_jwt = false

[functions.runware-proxy]
verify_jwt = false

[functions.stream-chapters]
verify_jwt = false

[functions.stripe-portal]
verify_jwt = false

[functions.tiktok-auth]
verify_jwt = false

[functions.tiktok-share-analytics]
verify_jwt = false

[functions.user-data]
verify_jwt = false

# External callbacks verify their own secret.
[functions.stripe-webhook]
verify_jwt = false
