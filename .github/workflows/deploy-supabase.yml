name: Deploy Supabase

on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - 'supabase/functions/**'

env:
  SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

jobs:
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.115.0

      - name: Link to production project
        run: supabase link --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}

      - name: Push migrations
        run: supabase db push

      - name: Deploy BetterAuth Edge Functions
        run: |
          supabase functions deploy credits --no-verify-jwt
          supabase functions deploy credits-validate --no-verify-jwt
          supabase functions deploy admin-credits --no-verify-jwt
          supabase functions deploy stream-chapters --no-verify-jwt
          supabase functions deploy groq-storyline --no-verify-jwt
          supabase functions deploy groq-api --no-verify-jwt
          supabase functions deploy runware-proxy --no-verify-jwt
          supabase functions deploy gallery-books --no-verify-jwt
          supabase functions deploy create-checkout --no-verify-jwt
          supabase functions deploy customer-portal --no-verify-jwt
          supabase functions deploy check-subscription --no-verify-jwt
          supabase functions deploy stripe-portal --no-verify-jwt
          supabase functions deploy provision-profile --no-verify-jwt
          supabase functions deploy user-data --no-verify-jwt
          supabase functions deploy generate-video --no-verify-jwt
          supabase functions deploy tiktok-auth --no-verify-jwt
          supabase functions deploy tiktok-share-analytics --no-verify-jwt

      - name: Deploy webhook functions (no JWT - receives external callbacks)
        run: |
          supabase functions deploy stripe-webhook --no-verify-jwt
